services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [data]
    security_opt: ["no-new-privileges:true"]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data"]
    volumes:
      - natsdata:/data
    networks: [data]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      CHAT_ENV: production
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:?required}
      CHAT_REDIS_ADDR: redis:6379
      CHAT_NATS_URL: nats://nats:4222
      CHAT_MEDIA_ROOT: /var/lib/chat/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - media:/var/lib/chat/media
    networks: [edge, data]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${CHAT_WEB_IMAGE:?build and set CHAT_WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?required}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
  natsdata:
  media:
