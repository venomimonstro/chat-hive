services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [data]
    security_opt: ["no-new-privileges:true"]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data"]
    volumes:
      - natsdata:/data
    networks: [data]
    security_opt: ["no-new-privileges:true"]

  media-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "mkdir -p /media && chown -R 65532:65532 /media && chmod 0750 /media"]
    volumes:
      - media:/media
    networks: [data]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["/chat-migrate"]
    env_file:
      - .env.production
    environment:
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:?required}
      CHAT_MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      CHAT_ENV: production
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL:?required}
      CHAT_REDIS_ADDR: redis:6379
      CHAT_NATS_URL: nats://nats:4222
      CHAT_MEDIA_ROOT: /var/lib/chat/media
      CHAT_TRUSTED_PROXY_CIDRS: 172.31.238.2/32
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    volumes:
      - media:/var/lib/chat/media
    networks:
      edge:
        ipv4_address: 172.31.238.3
      data:
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${CHAT_WEB_IMAGE:?build and set CHAT_WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CHAT_INTERNAL_API_BASE_URL: http://api:8080
    expose:
      - "3000"
    networks:
      edge:
        ipv4_address: 172.31.238.4
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CHAT_PUBLIC_HOST: ${CHAT_PUBLIC_HOST:?required}
      CHAT_TLS_EMAIL: ${CHAT_TLS_EMAIL:?required}
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      edge:
        ipv4_address: 172.31.238.2
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.238.0/24
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
  natsdata:
  media:
  caddydata:
  caddyconfig:
