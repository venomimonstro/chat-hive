name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.mod
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Module integrity
        run: |
          go mod tidy
          echo '--- BEGIN GENERATED go.mod ---'
          cat go.mod
          echo '--- END GENERATED go.mod ---'
          echo '--- BEGIN GENERATED go.sum ---'
          cat go.sum
          echo '--- END GENERATED go.sum ---'
          git diff --exit-code -- go.mod
          git ls-files --error-unmatch go.sum >/dev/null
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
